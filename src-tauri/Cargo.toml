[package]
name = "droid-switch"
version = "0.2.1"
description = "Local model configuration manager for Droid"
edition = "2021"
rust-version = "1.90"

[lib]
name = "droid_switch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
socket2 = "0.6.5"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "blocking"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sha2 = "0.11.0"
tauri = { version = "2", features = [] }
tempfile = "3.27.0"
uuid = { version = "1.28.0", features = ["v4", "serde"] }

toml = "1.1.8"
chrono = { version = "0.4", default-features = false, features = ["std"] }

# Proxy server dependencies
axum = "0.7"
tokio = { version = "1.53.2", features = ["net", "rt", "time"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }
